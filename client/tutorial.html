<!DOCTYPE html>
<html lang="cz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title>Průchod skenem kroje</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #screen {
        height: 100dvh;
        width: 100vw;
        padding: 2rem;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgb(57, 111, 47);
      }
      @media (max-width: 768px) {
        #screen{
          padding: 0px;
        }
      }

      #tutorial-window{
        position: relative; 
        padding: 2rem;
        height: 80%;
        width: 100%;
        max-width: 70rem;
        background-color: rgb(37, 72, 31);
        border-radius: 1rem;
        display: flex;
        flex-direction: column;
        row-gap: 1.5rem;
      }
      @media (max-width: 768px) {
        #tutorial-window{
          width: 100%;
          height: 100%;
          border-radius: 0px;
        }
      }
      #tutorial-content{   
        height: 90%;
        width: 100%;
        display: grid;
        grid-template-columns: 2fr 5fr;
        column-gap: 2rem;
      }
      @media (max-width: 768px) {
        #tutorial-content{
          grid-template-columns: 1fr;
          grid-template-rows: 1fr 1fr;
          row-gap: 1rem;
          padding-top: 1.5rem
        }
      }
      .tutorial__text{
        overflow: hidden;
        position: relative;
      }
      .text-container{
        width: 100%;
        height: 100%;
        overflow-y: scroll;
        scrollbar-width: none;
        display: flex;
        flex-direction: column;
        row-gap: 2rem;
      }
      .main-font{
        color: #ffffff;
        font-family: "DM Sans", sans-serif;
        font-size: 1.5rem;
      }
      #title{
        height: fit-content;
        font-size: 2rem;
      }
      @media (max-width: 768px) {
        #title{
          padding-top: 0px;
        }
      }
      #description{
        height: fit-content;
      }
      a:link{
        text-decoration: none;
        color: rgb(139, 255, 31);
      }
      a:visited {
        color: rgb(139, 255, 31);
        text-decoration: none;
      }
      a:hover {
        color: rgb(55, 255, 0);
        text-decoration: none;
      }
      .gradient{
        position: absolute;
        bottom: 0px;
        height: 10%;
        width: 100%;
        background: linear-gradient(180deg, rgba(37, 72, 31, 0) 0%, rgba(37, 72, 31, 0.7) 50%, rgba(37, 72, 31, 1) 100%);
        pointer-events: none;
      }
      #image-frame{
        border-radius: 1rem;
        overflow: hidden;
      }
      .image{
        height: 100%;
        position: relative;
        left: 50%;
        transform: translate(-50%, 0%);
        object-fit: cover;
        border-radius: 1rem;
      }
      .buttons-container{
        width: 100%;
        height: 4rem;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        row-gap: 1rem;
      }
      .tutorial__button{
        width: 6rem;
        height: 3rem;
        border-radius: 0.5rem;
        margin: auto;
        border: none;
        background-color:rgba(0, 0, 0, 0.3);
      }
      @media (max-width: 768px) {
        .tutorial__button{
          width: 5rem;
          height: 2.5rem;
          font-size: 1.2rem;
        }
      }
      #exit{
        position: fixed;
        right: 2rem;
        top: 2rem;
        background-color: rgba(0, 0, 0, 0.5);
        color: red;
      }
      @media (max-width: 768px) {
        #exit{
          right: 0.5rem;
          top: 0.5rem;
        }
      }
      
    </style>
  </head>
  <body>
    <div id="screen">
      <div id="tutorial-window">
        <div id="tutorial-content">
          <div class="tutorial__text">
            <div class="text-container ">
              <div id="title" class="main-font" ></div>
              <div id="description" class="main-font"></div>
            </div>
            <div class="gradient" ></div>
          </div>
          <div id="image-frame"></div>
        </div>

        <div class="buttons-container">
          <img id="previous" class="tutorial__button" src="./icons/prev.svg" alt="Předchozí"></img>
          <img id="next" class="tutorial__button" src="./icons/next.svg" alt="Další" wi></img>
        </div>
      </div>

      <a href="/index.html">
        <button id="exit" class="tutorial__button main-font" type="button">Odejít</button>
      </a>
    </div>

    <script type="module" src="./src/tutorial.js"></script>
  </body>
</html>
