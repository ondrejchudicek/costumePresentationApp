<!DOCTYPE html>
<html lang="cz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title>Průchod skenem kroje</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="screen" class="screen--tutorial">
      <div id="tutorial-window">
        <div id="tutorial-content">
          <div class="tutorial__text">
            <div class="text-container ">
              <div id="tutorial__title" class="main-font" ></div>
              <div id="tutorial__description" class="main-font"></div>
            </div>
            <div class="gradient" ></div>
          </div>
          <div id="tutorial__image-frame"></div>
        </div>

        <div class="tutorial__buttons-container">
          <img id="previous" class="tutorial__button" src="./icons/prev.svg" alt="Předchozí"></img>
          <img id="next" class="tutorial__button" src="./icons/next.svg" alt="Další" wi></img>
        </div>
      </div>

      <a href="/index.html">
        <button id="tutorial-exit" class="tutorial__button main-font" type="button">Odejít</button>
      </a>
    </div>

    <script type="module" src="./src/tutorial.js"></script>
  </body>
</html>
